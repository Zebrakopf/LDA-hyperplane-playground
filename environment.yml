name: lda_patch_lab
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - scipy
  - scikit-learn
  - pandas
  - pyarrow             # parquet trial tables (storage/io.py)
  - joblib
  - pydantic>=2         # v2 API (model_copy, model_dump_json, ConfigDict)
  - pytest              # the test suite is part of the deliverable, not optional
  # The app. The floor is VERIFIED, not guessed: tests/test_app.py fails on 1.53
  # and 1.54 (segmented-control values) and passes on 1.55, 1.56, 1.59 and 1.64
  # (docs/decisions.md D15).
  - streamlit>=1.55
  - plotly              # interactive figures (ui/plots.py)
  - matplotlib          # static figures for headless runs (scripts/figures.py)
  # NOT used: streamlit-drawable-canvas. Native Plotly click events do the same job
  # with no extra dependency (docs/decisions.md D10, D12).
